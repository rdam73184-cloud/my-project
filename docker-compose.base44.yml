name: base44-app

services:
  db:
    image: postgres:16-alpine
    restart: on-failure
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app_dev_password
      POSTGRES_DB: app
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 3s
      retries: 10
    labels:
      base44.project: Tasks
      base44.kind: infra

  migrate:
    image: postgres:16-alpine
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: app
      PGPASSWORD: app_dev_password
      PGDATABASE: app
    volumes:
      - ./api/db/migrations:/migrations:ro
    command:
      ["sh", "-ec", "for f in /migrations/*.sql; do echo \"applying $${f}\"; psql -v ON_ERROR_STOP=1 -f \"$${f}\"; done"]

  api:
    image: node:22
    restart: on-failure
    working_dir: /app
    environment:
      - NODE_ENV=development
      - PORT=4000
      - DATABASE_URL=postgres://app:app_dev_password@db:5432/app
      - BASE44_PREVIEW_MODE
    volumes:
      - ./api:/app
      - api_node_modules:/app/node_modules
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: ["sh", "-ec", "npm install --no-audit --no-fund && exec npm run dev"]
    healthcheck:
      test:
        ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 90s
    labels:
      base44.project: Tasks API
      base44.kind: api

  web:
    image: node:22
    restart: on-failure
    working_dir: /app
    ports:
      - "3000:5173"
    environment:
      - NODE_ENV=development
      - BASE44_PREVIEW_MODE
      # Vite >= 6.1 appends this to server.allowedHosts for the preview proxy.
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
    depends_on:
      api:
        condition: service_healthy
    command: ["sh", "-ec", "npm install --no-audit --no-fund && exec npm run dev"]
    healthcheck:
      test:
        ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 90s
    labels:
      base44.project: Tasks
      base44.kind: web
      base44.port: "3000"

volumes:
  db_data:
  api_node_modules:
  web_node_modules:
